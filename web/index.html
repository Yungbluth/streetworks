<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Every permit to dig up, close or work in a Tucson street since 1996, on a map you can rewind." />
    <title>Streetworks · Tucson street permits</title>
  </head>
  <body>
    <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
    <div class="layout" id="layout">
      <aside class="panel">
        <header>
          <h1><span class="wordmark">Streetworks</span> <span class="descriptor">Tucson street permits</span></h1>
          <p id="lede" class="lede">Every permit to dig up, close or work in a Tucson street.</p>
        </header>
        <div id="search"><p class="quiet loading">Loading the permit record…</p></div>
        <!-- Past the ranked list and the map, straight to Replay and the years. -->
        <a class="skip" href="#strip">Skip to the years</a>
        <!-- After the search box, so search stays the first thing Tab reaches. -->
        <p class="byline">
          <span>By Matthew Yungbluth</span>
          <a href="https://github.com/yungbluth/streetworks">Source on GitHub</a>
          <button type="button" class="linkish" id="how">How it works</button>
        </p>
        <div id="focus"></div>
        <div id="filters"></div>
        <div id="about"></div>
      </aside>
      <main class="map-area">
        <div id="map" aria-label="Map of street permits"></div>
        <!-- The years on show, large on the map; Replay runs them forward. -->
        <p id="year-stamp" class="year-stamp" aria-hidden="true"></p>
        <!-- What a finished replay showed; #status says it aloud. -->
        <p id="replay-note" class="replay-note" aria-hidden="true" hidden></p>
        <div id="tip" class="tip" hidden></div>
        <div id="aim" class="aim" hidden>
          <span class="crosshair" aria-hidden="true"></span>
          <p class="aim-line" aria-live="polite"></p>
        </div>
      </main>
      <div id="years"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
