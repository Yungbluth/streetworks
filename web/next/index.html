<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Streetworks: every Tucson street permit since 1996</title>
    <meta name="description" content="A plan sheet of every permit the City of Tucson has issued to dig up, close or work in a street, back to 1996. Rewind it, open a block, read its record." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f3f5f7'/%3E%3Cpath d='M8 2.5 14 13.5H2Z' fill='none' stroke='%23c4122f' stroke-width='1.6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
    <div class="sheet" id="sheet">
      <header class="sheet-head">
        <h1 class="mark">
          <span class="wordmark">Streetworks</span>
          <span class="sheet-title" id="sheet-title">City of Tucson right-of-way permits</span>
        </h1>
        <div id="search" class="search-cell"></div>
        <p class="sheet-info" id="sheet-info"></p>
      </header>
      <main class="plan" id="plan">
        <div id="map" aria-label="Map of street permits. Arrow keys move it; Enter opens the place at the crosshair."></div>
        <div id="tip" class="tip" hidden></div>
        <div id="aim" class="aim" hidden>
          <span class="crosshair" aria-hidden="true"></span>
          <p class="aim-line" aria-live="polite"></p>
        </div>
      </main>
      <section class="title-block" id="title-block" aria-label="Years and kinds of work"></section>
      <aside class="sheet-detail" id="detail" aria-label="Sheet detail"></aside>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
