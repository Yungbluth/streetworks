name: Build and deploy

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays, early morning in Tucson
  workflow_dispatch:
    inputs:
      skip_guard:
        description: Publish even if the permit count fell more than 10% (only after checking why)
        type: boolean
        default: false
  # Every branch runs the tests and builds; only main deploys.
  push:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer run waits rather than cancelling one mid-deploy
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go tests
        run: go test ./...

      - id: pages
        uses: actions/configure-pages@v5

      - name: Download the city's layers
        run: go run ./cmd/streetworks fetch

      # The guard compares with the live site and stops here if the permit count fell more than 10%.
      - name: Build the site data and the database
        env:
          SKIP_GUARD: ${{ inputs.skip_guard }} # empty on scheduled and push runs
          PUBLISHED: ${{ steps.pages.outputs.base_url }}/data/index.json
        run: |
          guard="$PUBLISHED"
          if [ "$SKIP_GUARD" = "true" ]; then guard=""; fi
          go run ./cmd/streetworks build -guard "$guard" -db streetworks.db

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build the page
        working-directory: web
        env:
          VITE_API: http://127.0.0.1:8092
        run: npm run build

      - name: Browser tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
          npx playwright test -c playwright.site.config.ts

      - name: Build and check the API image
        run: |
          docker build --target api -t streetworks-api .
          docker run -d --name api -p 8080:8080 -e PORT=8080 streetworks-api
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/health
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"ids":[0]}' \
            http://127.0.0.1:8080/v1/permits/lookup | jq -e '.permits["0"].permit'

      - name: API container logs
        if: failure()
        run: docker logs api || true

      - name: Build the kill switch image
        run: docker build --target killswitch -t streetworks-killswitch .

      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: |
            site/data
            streetworks.db
          if-no-files-found: error
          retention-days: 7

  api:
    needs: build
    # Skipped until the Google Cloud project exists; see docs/deploy.md
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
    outputs:
      url: ${{ steps.check.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: data

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT }}

      - name: Log Docker in to Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push the images
        run: |
          repo="$REGION-docker.pkg.dev/$PROJECT/streetworks"
          docker build --target api -t "$repo/api:$GITHUB_SHA" .
          docker build --target killswitch -t "$repo/killswitch:$GITHUB_SHA" .
          docker push "$repo/api:$GITHUB_SHA"
          docker push "$repo/killswitch:$GITHUB_SHA"

      - name: Deploy the API
        run: |
          gcloud run deploy streetworks-api \
            --image "$REGION-docker.pkg.dev/$PROJECT/streetworks/api:$GITHUB_SHA" \
            --region "$REGION" \
            --service-account "streetworks-api@$PROJECT.iam.gserviceaccount.com" \
            --max-instances 1 --min-instances 0 --concurrency 80 --timeout 10s \
            --memory 256Mi --cpu 1 --cpu-throttling \
            --allow-unauthenticated \
            --set-env-vars ORIGIN=https://yungbluth.github.io

      - name: Deploy the kill switch
        run: |
          gcloud run deploy killswitch \
            --image "$REGION-docker.pkg.dev/$PROJECT/streetworks/killswitch:$GITHUB_SHA" \
            --region "$REGION" \
            --service-account "killswitch@$PROJECT.iam.gserviceaccount.com" \
            --no-allow-unauthenticated --max-instances 1 \
            --set-env-vars "PROJECT_ID=$PROJECT"

      - id: check
        name: Check the API
        run: |
          url=$(gcloud run services describe streetworks-api --region "$REGION" --format='value(status.url)')
          curl -fsS --retry 5 --retry-all-errors "$url/health"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  pages:
    needs: [build, api]
    if: needs.api.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build the page
        working-directory: web
        env:
          VITE_API: ${{ needs.api.outputs.url }}
        run: npm run build

      # After the page build, so nothing it does can touch the data.
      - uses: actions/download-artifact@v4
        with:
          name: data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
