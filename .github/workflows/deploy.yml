name: Build and deploy

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays, early morning in Tucson
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer run waits rather than cancelling one mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go tests
        run: go test ./...

      - id: pages
        uses: actions/configure-pages@v5

      - name: Download the city's layers
        run: go run ./cmd/streetworks fetch

      # The guard compares with the live site and stops here if the permit count fell more than 10%.
      - name: Build the site data
        run: go run ./cmd/streetworks build -guard "${{ steps.pages.outputs.base_url }}/data/index.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build the page
        working-directory: web
        run: npm run build

      - name: Browser test
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
