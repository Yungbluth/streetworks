name: Build and deploy

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays, early morning in Tucson
  workflow_dispatch:
    inputs:
      skip_guard:
        description: Publish even if the permit count fell more than 10% (only after checking why)
        type: boolean
        default: false
  # every branch and pull request runs the tests and builds; only main deploys
  push:
  pull_request:

# Jobs ask for more only where they need it
permissions:
  contents: read

# One deploy at a time; a newer run waits rather than cancelling one mid-deploy
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the live site's address for the guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go tests
        run: go test ./...

      - id: pages
        uses: actions/configure-pages@v5

      - name: Download the city's layers
        run: go run ./cmd/streetworks fetch

      # The guard compares with the live site and stops here if the permit count fell more than 10%.
      - name: Build the site data and the database
        env:
          SKIP_GUARD: ${{ inputs.skip_guard }} # empty on scheduled and push runs
          PUBLISHED: ${{ steps.pages.outputs.base_url }}/data/index.json
        run: |
          guard="$PUBLISHED"
          if [ "$SKIP_GUARD" = "true" ]; then guard=""; fi
          go run ./cmd/streetworks build -guard "$guard" -db streetworks.db

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build the page
        working-directory: web
        env:
          VITE_API: http://127.0.0.1:8092
        run: npm run build

      - name: Browser tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
          npx playwright test -c playwright.site.config.ts

      - name: Build and check the API image
        run: |
          docker build --target api -t streetworks-api .
          docker run -d --name api -p 8080:8080 -e PORT=8080 streetworks-api
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/health
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"ids":[0]}' \
            http://127.0.0.1:8080/v1/permits/lookup | jq -e '.permits["0"].permit'

      - name: API container logs
        if: failure()
        run: docker logs api || true

      - name: Build the kill switch image
        run: docker build --target killswitch -t streetworks-killswitch .

      # the api job pushes these very images, so it never builds anything
      - name: Save the images
        if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT != ''
        run: docker save streetworks-api streetworks-killswitch | gzip > images.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT != ''
        with:
          name: images
          path: images.tar.gz
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: site/data
          if-no-files-found: error
          retention-days: 7

  # deploys the new API revision without sending it any traffic
  api:
    needs: build
    # Skipped until the Google Cloud project exists; see docs/deploy.md
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    environment: gcp
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
    outputs:
      url: ${{ steps.check.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: images

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT }}

      - name: Log Docker in to Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Push the images
        run: |
          gunzip -c images.tar.gz | docker load
          repo="$REGION-docker.pkg.dev/$PROJECT/streetworks"
          for name in api killswitch; do
            docker tag "streetworks-$name" "$repo/$name:$GITHUB_SHA"
            docker push "$repo/$name:$GITHUB_SHA"
          done

      - name: Deploy the API without traffic
        run: |
          traffic=()
          if gcloud run services describe streetworks-api --region "$REGION" >/dev/null 2>&1; then
            traffic=(--no-traffic)
          fi
          gcloud run deploy streetworks-api "${traffic[@]}" --tag next \
            --image "$REGION-docker.pkg.dev/$PROJECT/streetworks/api:$GITHUB_SHA" \
            --region "$REGION" \
            --service-account "streetworks-api@$PROJECT.iam.gserviceaccount.com" \
            --execution-environment gen1 \
            --max-instances 1 --min-instances 0 --concurrency 80 --timeout 10s \
            --memory 256Mi --cpu 1 --cpu-throttling \
            --allow-unauthenticated \
            --set-env-vars ORIGIN=https://yungbluth.github.io

      - id: check
        name: Check the new revision
        run: |
          next=$(gcloud run services describe streetworks-api --region "$REGION" --format=json |
            jq -r '.status.traffic[] | select(.tag == "next") | .url')
          curl -fsS --retry 5 --retry-all-errors "$next/health"
          url=$(gcloud run services describe streetworks-api --region "$REGION" --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy the kill switch
        run: |
          gcloud run deploy killswitch \
            --image "$REGION-docker.pkg.dev/$PROJECT/streetworks/killswitch:$GITHUB_SHA" \
            --region "$REGION" \
            --service-account "killswitch@$PROJECT.iam.gserviceaccount.com" \
            --execution-environment gen1 \
            --no-allow-unauthenticated --max-instances 1 \
            --set-env-vars "PROJECT_ID=$PROJECT"

  # Builds the page against the service's own address, not the tagged revision's
  page:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build the page
        working-directory: web
        env:
          VITE_API: ${{ needs.api.outputs.url }}
        run: npm run build

      # After the page build, so nothing it does can touch the data.
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  promote:
    needs: pages
    runs-on: ubuntu-latest
    environment: gcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT }}

      - name: Send all traffic to the new revision
        env:
          REGION: ${{ vars.GCP_REGION }}
        run: gcloud run services update-traffic streetworks-api --region "$REGION" --to-latest
